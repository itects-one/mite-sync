name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp verify

  # Each platform is built natively on its own runner and pushed by digest only; the
  # `docker` job below stitches the digests into one tagged multi-arch manifest. Native
  # arm64 runners are what make this affordable — emulating arm64 through QEMU took
  # 5–15 minutes per push.
  docker-build:
    if: github.event_name == 'push'
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mite-sync
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/mite-sync,push-by-digest=true,name-canonical=true,push=true
          # One cache scope per platform, otherwise the two builds evict each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mite-sync
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mite-sync
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect the pushed manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mite-sync
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # Rolls the fresh `latest` image out to the self-hosted instance. The runner joins the
  # tailnet as an ephemeral node tagged `tag:ci`, which the tailnet policy allows exactly one
  # thing: SSH as the deploy user on the host. Tailscale SSH authorises by that tag, so no SSH
  # key lives in GitHub. Host, user and compose path are secrets because the repo is public;
  # pull requests never get here, so forks never see them.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    # Queue rapid merges instead of letting two rollouts recreate the container at once.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}
      # The runner is new on every run, so there is no known_hosts to check against; the
      # connection is already authenticated end to end by the tailnet's node keys.
      #
      # Liveness is checked on the host because the policy opens nothing but SSH to CI. An
      # unauthenticated request answering 401 proves the app is up without the app's
      # credentials ever being in GitHub. `image prune` drops the image the update replaced;
      # the host boots from an SD card and would otherwise fill up one release at a time.
      - name: Pull, restart and wait for the app
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          port=$(docker compose port mite-sync 8080 | cut -d: -f2)
          for _ in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/profiles" || true)
            if [ "$status" = 401 ]; then
              echo "App is up (HTTP $status)"
              exit 0
            fi
            sleep 2
          done
          echo "App did not come back within 120 s (last status: $status)" >&2
          docker compose logs --tail 50 mite-sync >&2
          exit 1
          EOF

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
